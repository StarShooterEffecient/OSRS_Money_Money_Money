name: OmniFlip Market Engine Runner

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs every 10 minutes
  workflow_dispatch:        # Manual execution trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute OmniFlip Engine Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python engine.py

      - name: Commit Updated Memory Database & JSON Artifacts
        run: |
          git config --global user.name "OmniFlip-Bot"
          git config --global user.email "bot@omniflip.local"
          git add omniflip_memory.db public/data.json || true
          git commit -m "auto: update market memory & live telemetry [skip ci]" || exit 0
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
